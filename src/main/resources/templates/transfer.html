
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank | Transfer Money</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #17233c;
        }

        header {
            background: #10264a;
            color: white;
            padding: 20px 7%;
        }

        header h2 {
            margin: 0;
        }

        main {
            max-width: 650px;
            margin: 45px auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #15274712;
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e2;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #155eef;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: #155eef;
            text-decoration: none;
        }
    </style>
</head>

<body>
<header>
    <h2>SecureBank</h2>
</header>

<main>
    <h1>Transfer Money</h1>
    <p>Transfer money securely between bank accounts.</p>

    <form id="transferForm">
        <label for="fromAccount">From Account</label>
        <select id="fromAccount" required>
            <option value="">Loading your accounts...</option>
        </select>

        <label for="toAccount">Recipient Account Number</label>
        <input
                id="toAccount"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{12}"
                maxlength="12"
                placeholder="Enter 12-digit account number"
                required
        >

        <label for="amount">Amount (INR)</label>
        <input
                id="amount"
                type="number"
                min="0.01"
                max="1000000"
                step="0.01"
                placeholder="Enter amount"
                required
        >

        <button id="transferButton" type="submit">
            Transfer Money
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="/dashboard">← Back to Dashboard</a>
</main>

<script>
    async function loadAccounts() {
        const select = document.getElementById("fromAccount");
        const message = document.getElementById("message");

        try {
            const response = await fetch("/api/v1/accounts", {
                credentials: "same-origin"
            });

            if (response.status === 401 ||
                response.status === 403) {
                window.location.href = "/login-page";
                return;
            }

            if (!response.ok) {
                throw new Error("Could not load your accounts.");
            }

            const accounts = await response.json();
            select.innerHTML = "";

            if (!Array.isArray(accounts) || accounts.length === 0) {
                select.innerHTML =
                    '<option value="">No accounts available</option>';
                document.getElementById("transferButton").disabled = true;
                return;
            }

            accounts.forEach(account => {
                const option = document.createElement("option");
                option.value = account.id;
                option.textContent =
                    `${account.accountNumber} — ` +
                    `${account.currency} ${account.balance}`;
                select.appendChild(option);
            });
        } catch (error) {
            select.innerHTML =
                '<option value="">Unable to load accounts</option>';
            message.textContent = error.message;
        }
    }

    document.getElementById("transferForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const button = document.getElementById("transferButton");
            const message = document.getElementById("message");

            button.disabled = true;
            message.textContent = "Processing transfer...";

            try {
                const idempotencyKey = crypto.randomUUID();

                const response = await fetch("/api/v1/transfers", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fromAccountId:
                        document.getElementById("fromAccount").value,
                        toAccountId:
                        document.getElementById("toAccount").value,
                        amount:
                        document.getElementById("amount").value,
                        currency: "INR",
                        idempotencyKey: idempotencyKey
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Transfer failed."
                    );
                }

                message.textContent =
                    "Transfer completed successfully. Reference: " +
                    (result.transferId || result.id || "Created");

                await loadAccounts();
                this.reset();
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });

    loadAccounts();
</script>
</body>
</html>
