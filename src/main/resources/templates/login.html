
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            color: #172554;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dbeafe;
            border-radius: 14px;
            font-size: 26px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 26px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
<div class="login-card">
    <div class="logo">🏦</div>

    <h1>Welcome back</h1>
    <p class="subtitle">
        Sign in to access your SecureBank account.
    </p>

    <form id="loginForm">
        <label for="email">Email address</label>
        <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="username"
                required>

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

        <button type="submit" id="loginButton">Sign in</button>
        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="footer">
        SecureBank · Educational banking project
    </p>
</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";
        message.textContent = "";

        try {
            const response = await fetch("/api/v1/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Login failed. Check your credentials."
                );
            }

            window.location.href = "/dashboard";

            message.textContent = "Login successful!";
        } catch (error) {
            message.textContent =
                error.message || "Unable to connect to SecureBank.";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Sign in";
        }
    });
</script>
</body>
</html>
